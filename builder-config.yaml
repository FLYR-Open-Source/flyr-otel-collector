dist:
  name: flyr-otel-collector
  description: Custom OpenTelemetry Collector with FLYR datadog_tags processor
  output_path: ./_build
  module: github.com/FLYR-Open-Source/flyr-otel-collector
  version: 0.1.1
receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.157.0
  - gomod: >-
      github.com/open-telemetry/opentelemetry-collector-contrib/receiver/filelogreceiver
      v0.157.0
  - gomod: >-
      github.com/open-telemetry/opentelemetry-collector-contrib/receiver/kubeletstatsreceiver
      v0.157.0
  - gomod: >-
      github.com/open-telemetry/opentelemetry-collector-contrib/receiver/hostmetricsreceiver
      v0.157.0
  - gomod: >-
      github.com/open-telemetry/opentelemetry-collector-contrib/receiver/k8sclusterreceiver
      v0.157.0
  - gomod: >-
      github.com/open-telemetry/opentelemetry-collector-contrib/receiver/prometheusreceiver
      v0.157.0
  - gomod: >-
      github.com/open-telemetry/opentelemetry-collector-contrib/receiver/cloudflarereceiver
      v0.157.0
  - gomod: >-
      github.com/open-telemetry/opentelemetry-collector-contrib/receiver/googlecloudspannerreceiver
      v0.157.0
  - gomod: >-
      github.com/open-telemetry/opentelemetry-collector-contrib/receiver/httpcheckreceiver
      v0.157.0
  - gomod: >-
      github.com/open-telemetry/opentelemetry-collector-contrib/receiver/tcpcheckreceiver
      v0.157.0
  - gomod: >-
      github.com/open-telemetry/opentelemetry-collector-contrib/receiver/sqlserverreceiver
      v0.157.0
  - gomod: >-
      github.com/open-telemetry/opentelemetry-collector-contrib/receiver/sqlqueryreceiver
      v0.157.0
processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.157.0
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.157.0
  - gomod: >-
      github.com/open-telemetry/opentelemetry-collector-contrib/processor/k8sattributesprocessor
      v0.157.0
  - gomod: >-
      github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourcedetectionprocessor
      v0.157.0
  - gomod: >-
      github.com/open-telemetry/opentelemetry-collector-contrib/processor/attributesprocessor
      v0.157.0
  - gomod: >-
      github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourceprocessor
      v0.157.0
  - gomod: >-
      github.com/open-telemetry/opentelemetry-collector-contrib/processor/filterprocessor
      v0.157.0
  - gomod: >-
      github.com/open-telemetry/opentelemetry-collector-contrib/processor/transformprocessor
      v0.157.0
  - gomod: >-
      github.com/open-telemetry/opentelemetry-collector-contrib/processor/metricstransformprocessor
      v0.157.0
  - gomod: >-
      github.com/open-telemetry/opentelemetry-collector-contrib/processor/cumulativetodeltaprocessor
      v0.157.0
  - gomod: >-
      github.com/open-telemetry/opentelemetry-collector-contrib/processor/cardinalityguardianprocessor
      v0.157.0
  - gomod: github.com/FLYR-Open-Source/datadogtagsprocessor v0.1.2
exporters:
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.157.0
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.157.0
  - gomod: >-
      github.com/open-telemetry/opentelemetry-collector-contrib/exporter/fileexporter
      v0.157.0
  - gomod: >-
      github.com/open-telemetry/opentelemetry-collector-contrib/exporter/loadbalancingexporter
      v0.157.0
  - gomod: >-
      github.com/open-telemetry/opentelemetry-collector-contrib/exporter/datadogexporter
      v0.157.0
extensions:
  - gomod: >-
      github.com/open-telemetry/opentelemetry-collector-contrib/extension/datadogextension
      v0.157.0
  - gomod: >-
      github.com/open-telemetry/opentelemetry-collector-contrib/extension/cgroupruntimeextension
      v0.157.0
  - gomod: >-
      github.com/open-telemetry/opentelemetry-collector-contrib/extension/k8sleaderelector
      v0.157.0
connectors:
  - gomod: >-
      github.com/open-telemetry/opentelemetry-collector-contrib/connector/datadogconnector
      v0.157.0
  - gomod: >-
      github.com/open-telemetry/opentelemetry-collector-contrib/connector/signaltometricsconnector
      v0.157.0
  - gomod: >-
      github.com/open-telemetry/opentelemetry-collector-contrib/connector/routingconnector
      v0.157.0
