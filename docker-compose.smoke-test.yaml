services:
  collector:
    build:
      context: .
    image: ${COLLECTOR_IMAGE:-flyr-otel-collector:dev}
    command: ["--config=/etc/flyr-otel-collector/config.yaml"]
    volumes:
      - ./config.yaml:/etc/flyr-otel-collector/config.yaml:ro
      - ./.smoke-test-output:/tmp/smoke-test
    ports:
      - "4317:4317"
      - "4318:4318"

  telemetrygen-traces:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:${OTEL_VERSION}
    command: ["traces", "--otlp-endpoint", "collector:4317", "--otlp-insecure", "--traces", "1"]
    depends_on:
      - collector
    profiles: ["gen"]

  telemetrygen-logs:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:${OTEL_VERSION}
    command: ["logs", "--otlp-endpoint", "collector:4317", "--otlp-insecure", "--logs", "1"]
    depends_on:
      - collector
    profiles: ["gen"]
