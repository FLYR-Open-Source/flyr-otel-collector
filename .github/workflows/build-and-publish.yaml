name: Build, smoke test, and publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GO_VERSION: "1.27"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read versions from builder-config.yaml
        id: version
        run: |
          VERSION=$(grep -A5 '^dist:' builder-config.yaml | grep 'version:' | awk '{print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Stripped of its `v` for the image tag; Go module versions and the
          # telemetrygen image both need the prefix, so the script keeps it.
          OTEL_VERSION=$(scripts/otel-version.sh)
          echo "otel_version=${OTEL_VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Compute lowercase image name
        id: image
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - name: Verify git tag matches dist.version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          GIT_TAG="${GITHUB_REF#refs/tags/v}"
          if [ "$GIT_TAG" != "${{ steps.version.outputs.version }}" ]; then
            echo "git tag v$GIT_TAG does not match dist.version ${{ steps.version.outputs.version }} in builder-config.yaml"
            exit 1
          fi

      - name: Compute PR image tag
        id: pr
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy')
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "tag=${PR_NUMBER}-${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # dist.version is excluded from the key so a release-please version bump
      # reuses the existing cache instead of forcing a full recompile.
      - name: Compute Go cache key input
        run: grep -v '^  version:' builder-config.yaml > .go-cache-key

      - name: Restore Go build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ocb-${{ runner.os }}-go${{ env.GO_VERSION }}-${{ hashFiles('.go-cache-key') }}
          restore-keys: |
            ocb-${{ runner.os }}-go${{ env.GO_VERSION }}-

      - name: Build collector binary
        run: make build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Cosign verify distroless
        run: |
          cosign dockerfile verify Dockerfile --certificate-oidc-issuer https://accounts.google.com  --certificate-identity keyless@distroless.iam.gserviceaccount.com --base-image-only=true

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.version.outputs.otel_version }}-flyr-${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest
            ${{ steps.pr.outputs.tag && format('{0}/{1}:{2}', env.REGISTRY, steps.image.outputs.name, steps.pr.outputs.tag) || '' }}

      - name: Run smoke test
        env:
          COLLECTOR_IMAGE: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}-${{ github.sha }}
        run: ./scripts/smoke-test.sh

      - name: Collector logs (always)
        if: always()
        env:
          COLLECTOR_IMAGE: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}-${{ github.sha }}
        run: docker compose -f docker-compose.smoke-test.yaml -p otel-smoke-test logs collector 2>&1 || true

      - name: Clean up smoke test resources
        if: always()
        env:
          COLLECTOR_IMAGE: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}-${{ github.sha }}
        run: docker compose -f docker-compose.smoke-test.yaml -p otel-smoke-test down --volumes --remove-orphans || true

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy'))
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker push "${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}"
          docker push "${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.version.outputs.otel_version }}-flyr-${{ steps.version.outputs.version }}"
          docker push "${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}-${{ github.sha }}"
          docker push "${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest"

      - name: Push PR preview image
        if: (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy'))
        run: docker push "${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.pr.outputs.tag }}"

      - name: Sign with Cosign using GitHub OIDC Token
        if: (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy'))
        run: |
          cosign sign --yes --recursive "${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.pr.outputs.tag }}"

      - name: Sign with Cosign using GitHub OIDC Token
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cosign sign --yes --recursive "${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}"

      - name: Verify signature
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cosign verify "${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/build-and-publish.yaml@${{ github.ref }}"